<div [formGroup]="shoppingCartForm">
  <div class="g-3">
    @switch (field.type) {
      @case ('number') {
        <number [field]="field" [form]="shoppingCartForm"></number>
      }
      @case ('text') {
        <textbox [field]="field" [form]="shoppingCartForm"></textbox>
      }
      @case ('radio-attribute') {
        <radio-attribute [field]="field" [form]="shoppingCartForm"></radio-attribute>
      }
      @case ('radio-option') {
        <radio-option [field]="field" [form]="shoppingCartForm"></radio-option>
      }
      @case ('dropdown-attribute') {
        <dropdown-attribute (onResetAttribute)="resetAttribute($event)" (onChangeAttributeValue)="changeAttributeValue($event)" [field]="field" [form]="shoppingCartForm"></dropdown-attribute>
      }
      @case ('dropdown-option') {
        <dropdown-option [field]="field" [form]="shoppingCartForm"></dropdown-option>
      }
    }
  </div>
</div>
