<section class="common-padding bg-linear-gradient clientele-page-header">
    <div class="container">
        <div class="section-heading text-center mb-0">
            <h1>Clientele</h1>
            <p>
                The Brands and the people, who believe in us and our work. <br>
                Going stronger day by day, unlearning and relearning day by day, to be able to solve all your advertising problems.
            </p>
        </div>
        <div class="row justify-content-center mt-4 pt-2">
            <div class="col-6">
                <select class="form-select" (change)="changeCategory($event)" >
                    <option selected [value] = "0"> Select category </option>
                    <option *ngFor="let category of categoryList" [value]="$safeNavigationMigration(category?.id)">{{category?.name}}</option>
                </select>
            </div>
        </div>
    </div>
</section>

<section class="grey-background common-padding clients-services-section">
    <div class="container">
        <div class="row g-md-4 g-3 row-cols-xl-5 row-cols-lg-4 row-cols-md-3 row-cols-sm-2 row-cols-2">
            <div class="col" *ngFor="let clientele of filteredClienteleList">
                <div class="card border-0 clients-logo-card">
                    <img loading="lazy" src="{{clientele?.image}}" alt="{{clientele?.label}}">
                </div>
            </div>
        </div>
    </div>
</section> 

<app-call-to-action></app-call-to-action>
