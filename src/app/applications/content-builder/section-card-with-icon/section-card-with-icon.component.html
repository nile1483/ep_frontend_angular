<div class="section-heading text-center">
  @if (pageBlock?.title) {
    <h2 >{{pageBlock?.title}}</h2>
  }
  @if (pageBlock?.title) {
    <span class="separator mb-2" ></span>
  }
  @if (pageBlock?.simple_description) {
    <p>{{pageBlock?.simple_description}}</p>
  }
</div>
@if (pageBlock?.icon_block?.length > 0) {
  <div class="row g-4 justify-content-center">
    @for (block of pageBlock?.icon_block; track block) {
      <div class="col-12 col-md-6 col-lg-3 mb-lg-0 mb-4">
        <div class="card border-0 h-100">
          <div class="card-icon" [innerHTML]="block.icon | safeHtml"> </div>
          <h5>{{block?.title}}</h5>
          <div class="small-divider"></div>
          <p>{{block?.sub_title}}</p>
        </div>
      </div>
    }
  </div>
}
