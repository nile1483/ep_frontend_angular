<div class="row d-flex align-items-center" *ngFor="let content of pageBlock?.content " [ngSwitch]="content?.type">

    <div class="col-12 col-md-7">
        <h1 [innerHTML]="$safeNavigationMigration(content?.value?.header)"></h1>
        <div [innerHTML]="$safeNavigationMigration(content?.value?.sub_header)"></div>

        <div class="row" *ngIf="content?.image">
            <div *ngIf="content?.value?.url != null && content?.value?.label != null">
                <div class="col-lg-12">
                    <a aria-label="Link" href="{{content?.value?.url}}">
                        {{content?.value?.label}}
                    </a>
                    <span class="separator-left"></span>
                </div>
            </div>
            <div class="row c2a-contact" *ngIf="pageBlock.inquiryUser">
                <a target="_blank" href="/schedule-a-call" class="schedule-link py-2">
                    Schedule a Meeting
