<div class="row justify-content-center" *ngFor="let content of pageBlock?.content" [ngSwitch]="content?.type">

    <!-- title -->
    <div class="col-12" *ngSwitchCase="'title'">
        <div class="section-heading text-center mb-5"  *ngIf="content?.title != null">
            <h2 *ngIf="content?.title">{{content?.title}}</h2>
            <span class="separator mb-2" *ngIf="content?.title" ></span>
        </div>
    </div>

    <!-- divider -->
    <div class="col-12" *ngSwitchCase="'divider'">
        <div class="advertising-rate-block text-center" *ngIf="content?.divider != null">
            <div *ngIf='content?.divider == "divider" '>
                <hr class="divider-solid">
            </div>
        </div>
    </div>

    <!-- faq -->
    <div class="col-12" *ngSwitchCase="'faq'">
        <div class="" *ngIf="content?.values.length > 0" itemscope itemtype="https://schema.org/FAQPage">
            <div class="accordion faq-accordion" id="faqAccordion" >
                <div class="accordion-item" *ngFor="let item of content?.values; let i=index" itemscope itemprop="mainEntity"
                itemtype="https://schema.org/Question">
                    <h6 class="accordion-header" id="heading{{i}}">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                            [attr.data-bs-target]="'#collapse'+i" aria-expanded="false" aria-controls="collapse{{i}}">
                            <p itemprop="name" class="m-0"> {{item?.question}} </p>
                        </button>
                    </h6>
                    <div id="collapse{{i}}" class="accordion-collapse collapse" aria-labelledby="heading{{i}}"
                        data-bs-parent="#faqAccordion" itemscope itemprop="acceptedAnswer"
                        itemtype="https://schema.org/Answer" >
                        <div class="accordion-body default-content" itemprop="text">
                            <p [innerHTML]="item?.answer"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
