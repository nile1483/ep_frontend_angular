<div class="section-heading text-center mb-5">
    <h2 *ngIf="pageBlock?.title">{{pageBlock?.title}}</h2>
    <span class="separator mb-2" *ngIf="pageBlock?.title"></span>
    <p *ngIf="pageBlock?.simple_description">{{pageBlock?.simple_description}}</p>
</div>
<div class="row g-4" *ngIf="pageBlock?.title_subtitle?.length > 0">

    <div class="card terms-card" *ngIf="pageBlock?.title_subtitle">
        <div class="terms-list" *ngFor="let item of pageBlock?.title_subtitle">
            <div class="terms-heading">
                {{item?.title}}
            </div>
            <div class="terms-content" [innerHTML]="$safeNavigationMigration(item?.sub_title)"></div>
        </div>
    </div>
</div>
