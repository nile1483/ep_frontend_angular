<div class="section-heading text-center mb-3 mb-md-5">
  @if (pageBlock?.title) {
    <h2 >{{pageBlock?.title}}</h2>
  }
  @if (pageBlock?.title) {
    <span class="separator mb-2" ></span>
  }
  @if (pageBlock?.simple_description) {
    <p>{{pageBlock?.simple_description}}</p>
  }
</div>
@if (pageBlock?.title_subtitle?.length > 0) {
  <div class="row g-4">
    @for (item of pageBlock?.title_subtitle; track item) {
      <div class="col-12 col-md-6">
        <div class="card border-0 card-horizontal h-100">
          <div class="card-icon">
            <span></span>
          </div>
          <div class="card-body p-0">
            <h5> {{item?.title}} </h5>
            <p> {{item?.sub_title}} </p>
          </div>
        </div>
      </div>
    }
  </div>
}
