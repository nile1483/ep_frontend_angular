<section class="common-padding bg-linear-gradient terms-condition-page-header w-850">
    <div class="container">
        <div class="section-heading text-center mb-0">
            <h2> Payment Fail </h2>
        </div>
    </div>
</section>


<section class="order-process-section">
    <div class="container mb-5">
        <div class="row">
            <div class="col-md-6 mx-auto mt-5">
                <div class="payment">
                    <div class="payment_header_fail">
                        <div class="check">
                            <span [innerHTML]="$safeNavigationMigration(app_svg_icon_list?.['xmark']) | safeHtml" class="icon"></span>
                        </div>
                    </div>
                    <div class="content">
                        <h1>Something went wrong</h1>
                        <a aria-label="link" routerLink="/">Go To Home</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
