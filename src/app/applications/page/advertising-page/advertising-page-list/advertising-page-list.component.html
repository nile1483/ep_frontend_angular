@if (advertisingPageList.length > 0) {
  <section class="common-padding bg-linear-gradient contact-page-header">
    <div class="container">
      <div class="section-heading text-center mb-0">
        <h2>{{lpMedia}} Advertising Pages</h2>
      </div>
    </div>
  </section>
}

@if (advertisingPageList.length > 0) {
  <section class="services-detail-media-list">
    <div class="container">
      <div class="row justify-content-center g-md-3 g-2">
        @for (advertisingPage of advertisingPageList ; track advertisingPage) {
          <div class="col-sm-6 col-lg-4">
            <div class="services-card">
              <a aria-label="Link" [routerLink]="['/advertising',advertisingPage.slug]">
                {{advertisingPage?.name}}
              </a>
            </div>
          </div>
        }
      </div>
    </div>
  </section>
} @else {
  @if (isDataLoaded) {
    <app-sec-heading-pagenotfound ></app-sec-heading-pagenotfound>
  }
  <app-search-result></app-search-result>
}
