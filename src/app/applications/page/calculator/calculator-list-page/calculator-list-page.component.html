<!-- desktop filter button start -->
<section class="media-filter list-background d-lg-block d-none">
    <div class="container">

        <nav aria-label="breadcrumb">
            <ol class="breadcrumb" itemscope itemtype="https://schema.org/BreadcrumbList">
                <li class="breadcrumb-item" itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
                    <a aria-label="Link" href="{{webURL}}" itemprop="item">
                        <span itemprop="name">
                            <b> Home </b>
                        </span>
                    </a>
                    <meta itemprop="position" content="1" />
                </li>

                <li class="breadcrumb-item active" aria-current="page" itemprop="itemListElement" itemscope
                    itemtype="https://schema.org/ListItem">
                    <span itemprop="name"> Calculators </span>
                    <meta itemprop="position" content="2" />
                </li>
            </ol>
        </nav>

        <div class="media-filter-title d-flex align-items-center justify-content-between mb-4 position-relative">
            <h1> List of Calculators </h1>
        </div>
    </div>

</section>
<!-- desktop filter button end -->


<!-- media-list start -->
<section class="media-list">
    <div class="container">
        <!-- media-list-item found START-->
        <div class="row g-md-4 g-3">
            <div class="col-12 col-md-4 col-lg-4 col-xl-3" *ngFor="let card of cards">
                <div class="media-list-card shadow">
                    <div class="card" [routerLink]="[card.link]">
                        <img [src]="card.image" loading="lazy" class="card-img-top" [title]="card.title" [alt]="card.title" data-item-link-type="Item thumbnail">
                        <div class="card-body px-0">
                          <h5 class="card-title title-clamp" [matTooltip]="card.title">{{ card.title }}</h5>
                          <p class="card-text line-clamp">{{ card.description }}</p>
                        </div>
                      </div>
                </div>
            </div>
        </div>
        <!-- media-list-item found END-->
    </div>

</section>

<!-- media-list end -->
