@if (isloded) {
  <section class="section-services-grid white-background common-margin" >
    <div class="container">
      <div class="row justify-content-center">
        @if ((searchResult.length > 0)) {
          <div class="col-12 col-md-8">
            <div class="search-items">
              <ul>
                @for (item of searchResult; track item) {
                  <li class="w-100">
                    <a aria-label="Link" [routerLink]="['/',item.media,item.slug]">
                      <div class="row align-middle">
                        <div class="col-md-10 col-12"> {{item.term}} </div>
                        <div class="small text-muted text-end text-capitalize col-md-2 col-12"> {{item.media}}
                        </div>
                      </div>
                    </a>
                  </li>
                }
              </ul>
            </div>
          </div>
        } @else {
          <app-no-results></app-no-results>
        }
        <!-- If Data not found start-->
        <!-- If Data not found end-->
      </div>
    </div>
  </section>
}
